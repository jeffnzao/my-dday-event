name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Catalog audit
        run: npm run test:catalog
      - name: Security audit
        run: npm run test:security
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
